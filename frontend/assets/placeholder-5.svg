<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="50%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="bubble-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FCE7F3" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" fill="url(#bg-grad-5)" rx="24"/>
  
  <circle cx="120" cy="110" r="80" fill="url(#bubble-grad-5)" />
  <circle cx="480" cy="470" r="120" fill="url(#bubble-grad-5)" />

  <!-- Center Card Illustration -->
  <g transform="translate(150, 120)">
    <rect width="300" height="300" rx="30" fill="#FFFFFF" opacity="0.95" filter="drop-shadow(0 15px 25px rgba(236, 72, 153, 0.2))"/>
    
    <text x="150" y="140" font-size="70" text-anchor="middle">💖🌸🪢</text>
    <text x="150" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#831843" text-anchor="middle">FAVORITE PERSON</text>
    <text x="150" y="245" font-family="'Caveat', cursive" font-weight="700" font-size="28" fill="#DB2777" text-anchor="middle">Forever &amp; Always</text>
  </g>

  <!-- Cute Stamp / Tape -->
  <rect x="250" y="95" width="100" height="30" rx="4" fill="#FEF08A" opacity="0.9" transform="rotate(-3 300 110)"/>
  
  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BEST SISTER IN THE WORLD ❤️</text>
</svg>
