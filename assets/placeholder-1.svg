<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="50%" stop-color="#FECDD3"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE4E6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" fill="url(#bg-grad-1)" rx="24"/>
  
  <!-- Subtle decorative background circles -->
  <circle cx="120" cy="100" r="80" fill="url(#bubble-grad)" />
  <circle cx="500" cy="480" r="120" fill="url(#bubble-grad)" />
  <circle cx="520" cy="120" r="40" fill="#FFFFFF" opacity="0.3" />
  <circle cx="80" cy="500" r="60" fill="#FFFFFF" opacity="0.2" />

  <!-- Center Card Illustration -->
  <g transform="translate(150, 120)">
    <rect width="300" height="300" rx="30" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 15px 25px rgba(225, 29, 72, 0.15))"/>
    
    <!-- Sibling avatars / icons -->
    <text x="150" y="140" font-size="70" text-anchor="middle">🕶️✨🧃</text>
    <text x="150" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" fill="#881337" text-anchor="middle">PARTNERS IN CRIME</text>
    <text x="150" y="245" font-family="'Caveat', cursive" font-weight="700" font-size="26" fill="#E11D48" text-anchor="middle">Prerna &amp; Prakhar</text>
  </g>

  <!-- Cute Stamp / Tape -->
  <rect x="250" y="95" width="100" height="30" rx="4" fill="#FDE047" opacity="0.85" transform="rotate(-3 300 110)"/>
  
  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SECRET SIBLING ALLIANCE • 2024</text>
</svg>
