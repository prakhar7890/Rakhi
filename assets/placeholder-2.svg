<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="50%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bubble-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="600" fill="url(#bg-grad-2)" rx="24"/>
  
  <circle cx="100" cy="120" r="90" fill="url(#bubble-grad-2)" />
  <circle cx="480" cy="460" r="130" fill="url(#bubble-grad-2)" />
  <circle cx="480" cy="140" r="45" fill="#FFFFFF" opacity="0.3" />

  <!-- Center Card Illustration -->
  <g transform="translate(150, 120)">
    <rect width="300" height="300" rx="30" fill="#FFFFFF" opacity="0.92" filter="drop-shadow(0 15px 25px rgba(139, 92, 246, 0.18))"/>
    
    <text x="150" y="140" font-size="70" text-anchor="middle">🏆🗣️🔥</text>
    <text x="150" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#4C1D95" text-anchor="middle">ARGUMENT CHAMPION</text>
    <text x="150" y="245" font-family="'Caveat', cursive" font-weight="700" font-size="26" fill="#7C3AED" text-anchor="middle">"I was right all along"</text>
  </g>

  <!-- Cute Stamp / Tape -->
  <rect x="250" y="95" width="100" height="30" rx="4" fill="#A7F3D0" opacity="0.9" transform="rotate(4 300 110)"/>
  
  <text x="300" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">23 YEARS OF UNDEFEATED DEBATES</text>
</svg>
