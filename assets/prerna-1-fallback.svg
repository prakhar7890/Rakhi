<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="40%" stop-color="#FCE7F3"/>
      <stop offset="80%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="halo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FDF2F8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#hero-bg)" rx="32"/>

  <!-- Decorative bokeh background circles -->
  <circle cx="180" cy="200" r="140" fill="url(#halo-grad)" />
  <circle cx="680" cy="780" r="200" fill="url(#halo-grad)" />
  <circle cx="700" cy="220" r="70" fill="#FFFFFF" opacity="0.4" />
  <circle cx="120" cy="820" r="90" fill="#FFFFFF" opacity="0.3" />

  <!-- Center Portrait Frame -->
  <g transform="translate(180, 220)">
    <rect width="440" height="520" rx="36" fill="#FFFFFF" opacity="0.95" filter="drop-shadow(0 20px 40px rgba(225, 29, 72, 0.18))"/>
    
    <!-- Avatar Icon / Character Silhouette -->
    <circle cx="220" cy="210" r="110" fill="#FCE7F3" stroke="#F472B6" stroke-width="4"/>
    <text x="220" y="240" font-size="100" text-anchor="middle">👑🌸✨</text>
    
    <text x="220" y="370" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="34" fill="#881337" text-anchor="middle">Prerna Gupta</text>
    <text x="220" y="415" font-family="'Caveat', cursive" font-weight="700" font-size="30" fill="#DB2777" text-anchor="middle">Age 23 • The Birthday / Rakhi Star</text>
    <text x="220" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#9C7787" text-anchor="middle">Photo Slot: prerna-1.jpg</text>
  </g>

  <!-- Cute Stamp / Tape -->
  <rect x="330" y="190" width="140" height="40" rx="6" fill="#FEF08A" opacity="0.9" transform="rotate(-2 400 210)"/>

  <text x="400" y="860" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#881337" text-anchor="middle" letter-spacing="2">PLACEHOLDER FOR PRERNA-1.JPG</text>
  <text x="400" y="895" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#6B4C5A" text-anchor="middle">Add assets/prerna-1.jpg to display personal photo</text>
</svg>
