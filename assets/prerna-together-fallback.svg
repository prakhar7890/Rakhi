<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="grand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="35%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#grand-bg)" rx="32"/>
  
  <!-- Outer Gold Frame -->
  <rect x="25" y="25" width="950" height="650" rx="24" fill="none" stroke="url(#gold-border)" stroke-width="8"/>
  <rect x="40" y="40" width="920" height="620" rx="18" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Center Card Content -->
  <g transform="translate(180, 100)">
    <rect width="640" height="500" rx="28" fill="#FFFFFF" opacity="0.92" filter="drop-shadow(0 20px 45px rgba(225, 29, 72, 0.15))"/>
    
    <text x="320" y="110" font-size="70" text-anchor="middle">👫✨🪢💖</text>
    
    <text x="320" y="195" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="42" fill="#881337" text-anchor="middle">Prerna &amp; Prakhar</text>
    <text x="320" y="245" font-family="'Caveat', cursive" font-weight="700" font-size="34" fill="#DB2777" text-anchor="middle">"23 Years of Sibling Chaos &amp; Endless Love"</text>

    <!-- Rakhi knot illustration badge -->
    <rect x="170" y="290" width="300" height="60" rx="30" fill="#FFF1F2" stroke="#F472B6" stroke-width="2"/>
    <text x="320" y="330" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#BE123C" text-anchor="middle">🌸 HAPPY RAKSHA BANDHAN 🌸</text>

    <text x="320" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#9C7787" text-anchor="middle">Main Final Photo Slot: assets/prerna-together.jpg</text>
    <text x="320" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="14" fill="#6B4C5A" text-anchor="middle">Add assets/prerna-together.jpg to see personal photo here</text>
  </g>

  <!-- Corner Ornamental Accents -->
  <text x="60" y="90" font-size="32">🪔</text>
  <text x="910" y="90" font-size="32">🪔</text>
  <text x="60" y="635" font-size="32">✨</text>
  <text x="910" y="635" font-size="32">✨</text>
</svg>
